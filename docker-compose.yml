services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docforge_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "${PORT:-8086}"
      WORKER_POOL_SIZE: "${WORKER_POOL_SIZE:-8}"
      DOCFORGE_SIGNING_SECRET: "${DOCFORGE_SIGNING_SECRET:-docforge_hmac_sha256_secret_2026}"
    ports:
      - "${PORT:-8086}:${PORT:-8086}"
